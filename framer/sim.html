<!doctype html>
<!-- opszStepper/framer/sim.html — Framer-less simulator for the OpszStepper code component.
     Renders the REAL src/framer/OpszStepper.tsx (transpiled to OpszStepper.sim.mjs) in a plain
     browser, with the "framer" import mapped to a local shim and React from esm.sh. This proves
     the component's runtime logic (rendering, startOpszStepper, RenderTarget gating) outside Framer.
     Fraunces is loaded with its opsz axis exposed so the opsz cuts are visible.
     Build step: npx esbuild src/framer/OpszStepper.tsx --loader:.tsx=tsx --format=esm
       --jsx=automatic --jsx-import-source=react --outfile=framer/OpszStepper.sim.mjs -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>OpszStepper — Framer component simulator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet" />
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e12; color: #f4f4f6; padding: 4rem 6vw; }
		#root { width: 100%; max-width: 20ch; }
		.note { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font: 0.8rem system-ui; opacity: 0.5; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"react": "https://esm.sh/react@18",
			"react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
			"react-dom/client": "https://esm.sh/react-dom@18/client",
			"framer": "./framer-shim.js"
		}
	}
	</script>
</head>
<body>
	<div id="root"></div>
	<p class="note">Simulating the Framer code component in a plain browser — RenderTarget shimmed to 'preview'.</p>
	<script type="module">
		import React from "react"
		import { createRoot } from "react-dom/client"
		import OpszStepper from "./OpszStepper.sim.mjs"
		createRoot(document.getElementById("root")).render(
			React.createElement(OpszStepper, {
				text: "Optical sizing at every size",
				fontFamily: "Fraunces",
				fontSize: 120,
				color: "#f4f4f6",
				textAlign: "left",
				cuts: [
					{ family: "Fraunces", minSize: 0, maxSize: 24, opszValue: 9, opszMin: 9, opszMax: 144 },
					{ family: "Fraunces", minSize: 24, maxSize: 48, opszValue: 40, opszMin: 9, opszMax: 144 },
					{ family: "Fraunces", minSize: 48, maxSize: 0, opszValue: 120, opszMin: 9, opszMax: 144 },
				],
				hysteresis: 1,
			})
		)
	</script>
</body>
</html>
